{% extends "auth/_layout.html" %}
{% block title %}Sign in{% endblock %}
{% block form %}
<h2 class="h4 mb-1">Sign in</h2>
<p class="text-secondary small mb-4">Welcome back. Enter your details to open the dashboard.</p>
<form method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label" for="email">Email</label>
    <input class="form-control" id="email" name="email" type="email" required autofocus value="{{ request.form.email }}"></div>
  <div class="mb-3"><label class="form-label" for="password">Password</label>
    <input class="form-control" id="password" name="password" type="password" required></div>
  <button class="btn btn-primary w-100">Sign in</button>
</form>
<p class="small text-secondary mt-3 mb-0">No account? <a href="{{ url_for('auth.register') }}">Create one</a> (analyst, read-only access)</p>
{% if demo_login %}
<div class="small mt-3 p-2 rounded" style="background: var(--surface-2)">
  <strong>Demo admin:</strong> {{ demo_login }} / admin123
</div>
{% endif %}
{% endblock %}
