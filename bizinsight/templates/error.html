{% extends "base.html" %}
{% block title %}Error {{ error.code }}{% endblock %}
{% block body %}
<div class="auth-form" style="min-height:100vh">
  <div class="auth-card text-center">
    <div class="display-5 fw-bold text-secondary">{{ error.code }}</div>
    <h1 class="h5 mt-2">{{ error.name }}</h1>
    <p class="text-secondary small">{{ error.description }}</p>
    <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">Back to dashboard</a>
  </div>
</div>
{% endblock %}
